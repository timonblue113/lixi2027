.mute{color:var(--mute);font-size:17px}

button:active{background:var(--sk2)}
button.gold{background:var(--gold);color:var(--goldink)}

.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{width:auto;min-height:52px;margin:0;font-size:18px;font-weight:600;background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px}
.chip[aria-pressed="true"]{background:var(--sk);color:var(--skink);border-color:var(--skb)}

.code{font-size:48px;font-weight:800;letter-spacing:.12em;text-align:center;color:var(--red);background:var(--chip);border:3px dashed var(--gold);border-radius:18px;padding:14px;margin:10px 0 16px}

.env{width:180px;height:240px;margin:8px auto 18px;background:var(--sk);border:4px solid var(--gold);border-radius:16px;position:relative;display:flex;align-items:center;justify-content:center;font-size:72px;transition:transform .5s}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:90px;border-bottom:4px solid var(--gold);border-radius:12px 12px 50% 50%/12px 12px 60px 60px}
.env.open{transform:rotate(-4deg) scale(1.05)}

.err{color:var(--red);font-weight:600}
.pot{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pot span{background:var(--chip);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:16px;font-weight:600}
.pot span.gone{opacity:.35;text-decoration:line-through}
:root{--sk:var(--red);--sk2:var(--red2);--skink:#fff;--skg:var(--gold);--skb:var(--gold)}
:root[data-skin="dao"]{--sk:#d6336c;--sk2:#a61e4d;--skink:#fff;--skg:#ffe08a;--skb:#ffe08a}
:root[data-skin="loc"]{--sk:#0b7a4b;--sk2:#075c38;--skink:#fff;--skg:#ffd966;--skb:#ffd966}
.skb{width:auto;min-height:52px;margin:0;font-size:18px;font-weight:600;background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px}
.skb[aria-pressed="true"]{background:var(--sk);color:var(--skink);border-color:var(--skb)}

.lan span:nth-child(even){animation-delay:-1.5s}
.lo{font-size:28px;margin-top:10px}
@keyframes sway{50%{transform:rotate(8deg)}}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain span{position:absolute;top:-60px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.env{transition:none}.lan span{animation:none}}
body{background:radial-gradient(900px 420px at 50% -8%,color-mix(in srgb,var(--sk) 28%,transparent),transparent),var(--bg);background-attachment:fixed}
main{position:relative;z-index:1}
.banner{background:linear-gradient(160deg,var(--sk),var(--sk2));box-shadow:0 12px 32px color-mix(in srgb,var(--sk) 40%,transparent),inset 0 0 0 5px color-mix(in srgb,var(--skb) 30%,transparent)}

.card{box-shadow:0 8px 22px rgba(0,0,0,.14);border-radius:22px}
h2{letter-spacing:.01em}
button{box-shadow:0 5px 0 var(--sk2),0 10px 18px rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sk2)}
button.gold{background:linear-gradient(180deg,#ffdf80,var(--gold));box-shadow:0 5px 0 #b8861b,0 10px 18px rgba(0,0,0,.2)}

button.ghost,.chip,.skb{box-shadow:none}
button.ghost:active,.chip:active,.skb:active{transform:none;box-shadow:none}
button:disabled{opacity:.6}
.env::after{content:"";position:absolute;top:62px;left:50%;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b3,var(--gold));border:3px solid #b8861b}
.env{box-shadow:0 14px 30px rgba(0,0,0,.3)}
.q{box-shadow:0 4px 12px rgba(0,0,0,.1)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
main{padding-bottom:96px}
#mus{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:58px;min-height:58px;height:58px;margin:0;padding:0;border-radius:50%;font-size:28px;z-index:60;background:var(--card);color:var(--ink);border:2px solid var(--skb)}
#mus[aria-pressed="true"]{background:var(--sk);color:var(--skink)}
.bkb{width:auto;min-height:52px;margin:0;font-size:18px;font-weight:600;background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:none}

.bkb:active{transform:none;box-shadow:none}

.env{align-items:flex-end;padding-bottom:28px}
.bpb{width:auto;min-height:52px;margin:0;font-size:18px;font-weight:600;background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:none}
.bpb[aria-pressed="true"]{background:var(--sk);color:var(--skink);border-color:var(--skb)}
.bpb:active{transform:none;box-shadow:none}
</style>

};

var BANKS=[["970422","MB Bank"],["970436","Vietcombank"],["970407","Techcombank"],["970432","VPBank"],["970416","ACB"],["970418","BIDV"],["970415","VietinBank"],["970423","TPBank"],["970405","Agribank"],["970403","Sacombank"],["970441","VIB"],["970426","MSB"],["970443","SHB"],["970448","OCB"],["970437","HDBank"],["970440","SeABank"],["970449","LPBank"],["970431","Eximbank"]];function bankName(b){for(var i=0;i<BANKS.length;i++)if(BANKS[i][0]==b)return BANKS[i][1];return b}

function split(total,n){var u=Math.floor(total/1000),a=[],i;for(i=0;i<n;i++)a.push(1);var left=u-n;while(left>0){a[Math.floor(Math.random()*n)]++;left--}return a.map(function(x){return x*1000})}
function mkRoom(code,total,n,topics,custom,mode){return{code:code,total:total,n:n,topics:topics,custom:custom,mode:mode,pot:split(total,n),used:[],log:[]}}

function go(s){S.screen=s;S.err="";S.res=null;render();window.scrollTo(0,0)}
function genCode(){var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",o="",i;for(i=0;i<6;i++)o+=c[Math.floor(Math.random()*c.length)];return o}

 for(i=0;i<w.length;i++)if(a.toLowerCase().indexOf(w[i])>-1)s++;
 if(/(.)\1{4,}/.test(a)||a.length<15)s=Math.min(s,3);return Math.max(1,Math.min(10,s))}
function pickEnv(rem,sc){var s=rem.slice().sort(function(a,b){return a-b}),n=s.length,idx=Math.round((sc-1)/9*(n-1))+Math.floor(Math.random()*3)-1;return s[Math.min(n-1,Math.max(0,idx))]}
function render(){var h="",r=S.cur?S.rooms[S.cur]:null;
 if(S.screen=="home"){
  h='<div class="banner"><div class="lan"><span>🏮</span><span>🌸</span><span>🏮</span></div><div style="font-size:64px;line-height:1.1">🐐</div><h1>Lì Xì Dê Vàng</h1><p>Xuân Đinh Mùi 2027: trả lời cho vui, mở bao rước lộc!</p><div class="lan lo"><span>💰</span><span>🍊</span><span>🧧</span><span>🍊</span><span>💰</span></div></div>'+
  '<button id="mk">Tạo phòng lì xì</button>'+
  '<div class="card" style="margin-top:22px"><h2>Vào phòng bằng mã</h2><label for="cd">Mã phòng 6 ký tự</label><input id="cd" maxlength="6" autocapitalize="characters" placeholder="VD: TET2027" value=""><button class="gold" id="jn">Vào mở bao</button><p class="err">'+esc(S.err)+'</p></div>'+
  '<div class="card"><b>Chọn áo Tết cho trang</b><div class="chips" style="margin-top:10px">'+[["mai","🌼 Mai vàng"],["dao","🌸 Đào hồng"],["loc","🍃 Xanh lộc"]].map(function(a){return '<button class="skb" data-s="'+a[0]+'" aria-pressed="'+((document.documentElement.dataset.skin||"mai")==a[0])+'">'+a[1]+'</button>'}).join("")+'</div></div>'+
  '<p class="mute">Người nhận không cần đăng nhập. Chủ phòng đăng nhập Google, 3 phòng đầu miễn phí.</p>'}
 else if(S.screen=="create"){
  h='<h2>Tạo phòng lì xì</h2><p class="mute">Bản thử: đăng nhập Google và thanh toán được giả lập.</p><div class="card">'+

  '<label for="sl">Số bao lì xì</label><input id="sl" type="number" inputmode="numeric" value="8" min="2" max="50">'+
  '<p class="mute" style="margin:10px 0 0">Bao được chia ngẫu nhiên, câu trả lời không ảnh hưởng số tiền nhận được.</p></div>'+
  '<div class="card"><label style="margin-top:0">Chọn lĩnh vực câu hỏi</label><div class="chips">'+

  '<label for="cq">Hoặc tự soạn 1 câu hỏi gài hàng</label><textarea id="cq" placeholder="VD: Bao giờ dẫn người yêu về ra mắt?"></textarea></div>'+

 else if(S.screen=="room"){

   '<button class="gold" id="nx">Người tiếp theo</button><button class="ghost" id="hm">Về trang chủ</button>'}
 }
 document.getElementById("app").innerHTML=h;bind()}

 document.body.appendChild(box);setTimeout(function(){box.remove()},4200)}

 on("mk",function(){go("create")});document.querySelectorAll(".skb").forEach(function(b){b.onclick=function(){document.documentElement.dataset.skin=b.dataset.s;render()}});on("bk",function(){go("home")});on("hm",function(){S.cur=null;S.q=null;go("home")});

<script>

 api("/api/rooms/"+encodeURIComponent(S.cur)+"/open",{method:"POST",body:{name:nm,answer:an,question:S.q,bank_bin:bk,bank_account:ac}}).then(function(x){
  if(x.status!=200)return bad(x.j.error||"Có lỗi, thử lại nhé");

 on("pb",function(){go("create")});clearInterval(S.poll);
 S.poll=setInterval(function(){api("/api/me").then(function(x){if(x.j&&x.j.is_pro){clearInterval(S.poll);me=x.j;S.screen="create";render()}})},4000)}

 if(!silent){a.innerHTML='<h2>Phòng '+esc(c)+'</h2><p class="mute">Đang tải…</p>';clearInterval(S.hp);S.hp=setInterval(function(){if(S.screen=="host")hostView(true)},6000)}

<script>
(function(){
var SC=[261.63,293.66,329.63,392,440,523.25,587.33,659.25],M=[4,-1,3,4,5,-1,4,3,2,-1,3,2,1,-1,0,-1,4,-1,3,4,5,6,5,4,3,-1,2,3,4,-1,-1,-1],B=[0,2,3,0],ac=null,g=null,timer=null,step=0,next=0,playing=false;
function tone(f,t,d,type,v){var o=ac.createOscillator(),e=ac.createGain();o.type=type;o.frequency.value=f;e.gain.setValueAtTime(0.0001,t);e.gain.exponentialRampToValueAtTime(v,t+0.012);e.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(e);e.connect(g);o.start(t);o.stop(t+d+0.05)}
function beat(i,t){var m=M[i%32],bar=((i%32)/8)|0;if(m>=0){tone(SC[m],t,0.5,"triangle",0.5);tone(SC[m]*2,t,0.18,"sine",0.1)}if(i%8==0)tone(SC[B[bar]]/2,t,1,"sine",0.4);if(i%4==2)tone(SC[B[bar]],t,0.14,"sine",0.07)}
function sched(){while(next<ac.currentTime+0.35){beat(step,next);step++;next+=0.25}}
var btn=document.createElement("button");btn.id="mus";btn.type="button";document.body.appendChild(btn);
function ui(){btn.textContent=playing?"🎵":"🔇";btn.setAttribute("aria-pressed",playing?"true":"false");btn.setAttribute("aria-label",playing?"Tắt nhạc xuân":"Bật nhạc xuân")}
function start(){if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();g=ac.createGain();g.gain.value=0.16;g.connect(ac.destination)}
 if(ac.state=="suspended")ac.resume();next=ac.currentTime+0.1;clearInterval(timer);timer=setInterval(sched,100);playing=true;ui()}
function stop(){clearInterval(timer);playing=false;ui()}
btn.onclick=function(){if(playing){stop();try{localStorage.setItem("mus","0")}catch(e){}}else{start();try{localStorage.setItem("mus","1")}catch(e){}}};
document.addEventListener("visibilitychange",function(){if(!ac)return;if(document.hidden)ac.suspend();else if(playing)ac.resume()});
ui();var want="0";try{want=localStorage.getItem("mus")}catch(e){}
if(want=="1"){var once=function(e){document.removeEventListener("pointerdown",once);if(e.target!==btn)start()};document.addEventListener("pointerdown",once)}
})();
</script>
